# BrainDesk: X direttamente sul driver DRM del pannello.
# Niente accelerazione 3D (non c'e' GPU); ShadowFB tiene il disegno in RAM
# normale (veloce da leggere) e invia al pannello solo le righe cambiate.
Section "Device"
	Identifier "brain"
	Driver     "modesetting"
	Option     "AccelMethod" "none"
	Option     "ShadowFB" "true"
	Option     "PageFlip" "false"
	Option     "SWcursor" "true"
EndSection
Section "Screen"
	Identifier   "screen"
	Device       "brain"
	DefaultDepth 16
EndSection
Section "ServerFlags"
	Option "AutoAddGPU" "false"
EndSection
