# BrainDesk: X direttamente sul driver DRM del pannello.
# Niente accelerazione 3D (non c'e' GPU): GLX resta fuori, il suo
# caricamento (Mesa software) costava 6 secondi a ogni avvio.
# ShadowFB tiene il disegno in RAM normale e invia al pannello solo le
# righe cambiate. I dispositivi di input sono elencati da brain-ui.
Section "Module"
	Disable "glx"
EndSection
Section "ServerFlags"
	Option "AutoAddGPU" "false"
	Option "AutoAddDevices" "false"
	Option "DontVTSwitch" "true"
	Option "DontZap" "true"
	Option "BlankTime" "0"
	Option "StandbyTime" "0"
	Option "SuspendTime" "0"
	Option "OffTime" "0"
EndSection
Section "Device"
	Identifier "brain"
	Driver     "modesetting"
	Option     "AccelMethod" "none"
	Option     "ShadowFB" "true"
	Option     "PageFlip" "false"
	Option     "SWcursor" "true"
EndSection
Section "Screen"
	Identifier   "screen"
	Device       "brain"
	DefaultDepth 16
EndSection
